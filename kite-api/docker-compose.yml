# Docker Compose for local development
# Usage: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: kitelab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kitelab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kite-Lab API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitelab-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kitelab
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: dev-secret-for-docker-compose
      ALLOWED_EMAILS: test@example.com
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
