# Railway deployment configuration
# Build from repo root to include both kite-api/ and scripts/
# https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Run migrations before starting the server
startCommand = "sh -c 'scripts/init_persistent_storage.sh && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"

# Health check configuration
healthcheckPath = "/api/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Number of instances (1 for starter plan)
numReplicas = 1

[service]
# Internal port (Railway maps external traffic to this)
internalPort = 8000
