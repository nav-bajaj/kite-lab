# Suppressions — known/accepted findings keyed to risk register rows.
#
# Each entry marks a finding as triaged. parse_findings.py filters these
# out of the "new findings" diff during /security-audit.
#
# Schema:
#   - fingerprint: sha256(rule + file + line + snippet) — generated by parse_findings.py
#     rule:        scanner rule ID (e.g. "B105", "gitleaks.generic-api-key",
#                  "fastapi-route-missing-auth")
#     scanner:     "gitleaks" | "bandit" | "semgrep" | "ruff" | "pip-audit"
#                  | "npm-audit" | "trufflehog" | "trivy" | "eslint"
#     file:        repo-relative path
#     line:        1-based line number (use 0 if not applicable, e.g. dep-level finding)
#     register:    matching R-XXX row in docs/security/risk-register.md
#     justification: short text (~120 chars) on why this is accepted
#     opened:      ISO date this suppression was added
#     expires:     ISO date by which this suppression must be re-reviewed
#                  (parse_findings.py warns when expires < today)
#
# Lifecycle:
#   - Add a suppression only after creating/updating a register row that
#     covers the finding.
#   - Re-review on the expires date OR whenever the surrounding code changes
#     (the fingerprint will mismatch and the finding will re-surface).
#   - Never suppress a Critical/High finding without explicit human approval.

suppressions: []

