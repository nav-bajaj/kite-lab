  - 72e3aef   # Phase 7 — main authenticated app on the brand

# Verified self-contained: kite-dashboard mirrors token VALUES into
# globals.css (.mw-brand/.mw-app); no file:/package dep on the design
# repo, so it deploys to Vercel as-is. Registry decision (8.6) deferred
# as non-blocking. See RESULTS.md.
depends_on:
  - content_redesign   # editorial layer + persona inform the brand contract
supersedes:
  - finance-content-os/design-system  # superseded by the new ~/marketworks-design repo

# Sibling repo this initiative spans (new — its own repo, unlike content_*)
sibling_repo:
  path: /Users/navdeep/marketworks-design
  role: canonical design system (tokens, components, brand contract)
  package: "@marketworks/design"
  visibility: private

# Strategic frame
target_viewer: |
  Karan (see ~/finance-content-os/brand/personas/karan.md). Visual
  decisions are judged by whether they land for him scrolling on
  a phone — not for an analyst at a Bloomberg terminal.

design_references:
  emulate: [FT, NYT, The New Yorker, The Morning Context, Capitalmind, Zerodha Varsity]
  avoid: [Linear/SaaS purple-gradient cards, finfluencer thumbnails, Bombay Shaving lifestyle photography]

# Locked foundations (Phase 0; surface/serif/semantics revised 2026-06-04
# after the Pencil brand-guide validation — see pencil_brand_guide below)
foundations:
  type_serif:  Fraunces           # was Newsreader; swapped 2026-06-04
  type_sans:   Outfit
  type_mono:   IBM Plex Mono
  brand_palette:
    mist:         "#ECF3EF"        # surface; was warm cream #FAF7F2 (2026-06-04)
    lichen:       "#14715F"        # the deep teal that defines the brand
    signal_green: "#55C374"        # the named brand accent
    purple:       "#9750F8"        # accent only, not load-bearing
    purple_soft:  "#D1A8EE"
    ink:          "#1A1A1A"
  semantic_palette:                # muted 2026-06-04 to harmonize with brand
    positive:    "#3F8059"         # was #0F8A3C
    negative:    "#A64C42"         # was #B91C1C
    warning:     "#9E6A35"         # was #B45309
    info:        "#42608E"         # was #1D4ED8
  spacing_scale:  4px-modular
  motion_default: 200ms-ease-out

# Visual validation + brand refinement (founder-requested, 2026-06-04)
pencil_brand_guide:
  file: /Users/navdeep/marketworks-design/reference/brand-guide.pen
  built: |
    9 boards bound to the real tokens — cover, color, typography,
    logo/space/motion + applied surfaces (social carousel, library
    reading page, dark insights dashboard). Founder wanted to SEE the
    system on real surfaces before committing more engineering.
  impeccable_finding: |
    Impeccable's brand register flagged the system as sitting in the
    saturated "editorial-typographic" lane (italic serif + mono labels +
    monochrome restraint + no imagery). The "visually lacking" feeling
    was composition, not execution — fix = richer composition + real data
    viz, plus the three token refinements below.
  decisions:
    - surface:   warm cream #FAF7F2 -> cool mist #ECF3EF (tilted to lichen)
    - semantics: muted to harmonize with the low-saturation brand
    - serif:     Newsreader -> Fraunces (chosen from a 3-way reading mock)
  related_commits:    # in ~/marketworks-design (separate git repo)
    - 6c6ffec   # surface cream -> mist
    - c7596ae   # muted semantic palette
    - e245347   # serif Newsreader -> Fraunces
    - c2fc044   # Phase 3.5: enriched CarouselSlide (footer band + stat)

tools:
  in_use:
    - impeccable             # github.com/pbakaus/impeccable — installed as a Claude Code skill
    - playwright             # visual regression + token contract tests
  deferred:
    - open_design            # github.com/nexu-io/open-design — not adopted; impeccable covers the agentic surface we need

# Surfaces to design for, in priority order
surfaces:
  v1:
    - instagram_assets       # carousel slides, thumbnails, reel overlays
    - library_reading_page   # /library and /library/[slug]
    - insights_dashboard     # /insights and its sub-pages
  v2:
    - landing_page
    - signup_page
  v3:
    - main_dashboard         # authenticated app
    - existing_migration     # replace ad-hoc styles in current kite-dashboard
